# Copiado do self-hosting oficial da Supabase (github.com/supabase/supabase, docker/volumes/api/envoy/cds.yaml),
# baixado em 2026-11-11, com o compose na versão 0.8.4. Licença Apache-2.0.
# Alterado para o emprestai (ADR-006): só o cluster do Auth; os dos outros serviços saíram.

resources:
  - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: auth
    connect_timeout: 5s
    type: STRICT_DNS
    dns_refresh_rate: 5s
    dns_failure_refresh_rate:
      base_interval: 1s
      max_interval: 1s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: auth
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: auth
                    port_value: 9999
    ignore_health_on_host_removal: true
    health_checks:
      - timeout: 2s
        interval: 5s
        unhealthy_threshold: 3
        healthy_threshold: 2
        http_health_check:
          path: /health
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_connections: 10000
          max_pending_requests: 10000
          max_requests: 10000
